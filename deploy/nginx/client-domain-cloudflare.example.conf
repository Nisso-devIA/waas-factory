# EXAMPLE ONLY — client domain behind Cloudflare (orange cloud) + Full (strict).
# Do NOT copy over visibleartisan.fr or other existing vhosts.
# Replace example-client.fr with the real client domain when provisioning.

# HTTP : ACME challenge must stay reachable through Cloudflare proxy.
server {
    listen 80;
    listen [::]:80;
    server_name example-client.fr www.example-client.fr;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS origin — Cloudflare Full (strict) requires a valid cert here
# (certbot OR Caddy on-demand). Prefer proxying to Caddy :8080 like the
# ArtisanVisible TEST path, or terminate TLS in Nginx with LE certs.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name example-client.fr www.example-client.fr;

    # ssl_certificate     /etc/letsencrypt/live/example-client.fr/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/example-client.fr/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
