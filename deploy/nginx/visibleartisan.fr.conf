# ArtisanVisible — visibleartisan.fr (ADD-ONLY; other vhosts untouched)
# Reverse-proxy to Caddy on 127.0.0.1:8080
# Security headers: this vhost only (HSTS / CSP / framing / COOP).
# Cloudflare: real_ip may be global in conf.d/cloudflare-realip.conf on the VPS.

# HTTP — ACME challenge then redirect to HTTPS apex
server {
    listen 80;
    listen [::]:80;
    server_name visibleartisan.fr www.visibleartisan.fr;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://visibleartisan.fr$request_uri;
    }
}

# HTTPS www → HTTPS apex
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.visibleartisan.fr;

    ssl_certificate /etc/letsencrypt/live/visibleartisan.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/visibleartisan.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # HSTS on redirect responses too
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://visibleartisan.fr$request_uri;
    }
}

# HTTPS apex → Caddy (:8080 vitrine + demos /{slug}/ + API/webhook/upload)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name visibleartisan.fr;

    ssl_certificate /etc/letsencrypt/live/visibleartisan.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/visibleartisan.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    # --- Security headers (apex host only; not global http{}) ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Strict CSP (Observatory): script-src 'self' only — no unsafe-inline, no Tailwind CDN.
    # Demos/upload use /demo-assets/demo.css + external JS. style-src keeps unsafe-inline
    # for a few Astro style= attributes (Observatory only penalizes script-src).
    # Stripe Checkout is a top-level redirect off-site.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        allow all;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
